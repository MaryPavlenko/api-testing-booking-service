name: API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  newman-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Create reports directory
        run: mkdir -p newman-reports

      - name: Run Postman collection
        run: |
          newman run postman-collections/restful-booker.postman_collection.json \
            --env-var baseUrl=https://restful-booker.herokuapp.com \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-reports/report.html

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: newman-reports/report.html